[project]
name = "creative-bounty"
version = "0.7.0"
description = "Demand-before-generation agent for paid generative media opportunities"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "pydantic>=2.0", "boto3>=1.34", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.9"]
genblaze = ["genblaze-core", "genblaze-s3", "genblaze-openai", "google-genai>=2.0", "genblaze-nvidia"]

[project.scripts]
creative-bounty = "creative_bounty.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
